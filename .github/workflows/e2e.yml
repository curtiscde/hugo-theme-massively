name: e2e tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e:
    name: hugo ${{ matrix.hugo-label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Hugo the theme claims to support (theme.toml min_version).
          - hugo-version: "0.158.0"
            hugo-label: "min (0.158.0)"
          # Whatever Hugo has shipped most recently.
          - hugo-version: "latest"
            hugo-label: "latest"

    steps:
    - uses: actions/checkout@v7

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ matrix.hugo-version }}
        extended: true

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'

    - run: npm ci

    - run: npm run e2e:headless
